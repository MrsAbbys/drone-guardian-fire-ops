services:
  fireops-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fireops-master
    hostname: master
    restart: always
    networks:
      fireops-net:
        aliases:
          - master
    volumes:
      - ../:/workspace
    ports:
      - "127.0.0.1:2222:22"

  fireops-worker1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fireops-worker1
    hostname: worker1
    restart: always
    networks:
      fireops-net:
        aliases:
          - worker1
    volumes:
      - ../:/workspace

  fireops-worker2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fireops-worker2
    hostname: worker2
    restart: always
    networks:
      fireops-net:
        aliases:
          - worker2
    volumes:
      - ../:/workspace

networks:
  fireops-net:
    driver: bridge
